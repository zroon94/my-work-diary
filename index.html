<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📋 나의 업무 다이어리</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4f6ef7;
    --primary-d: #3a56d4;
    --bg: #f0f2f8;
    --card: #ffffff;
    --sidebar: #1e2a45;
    --sidebar-t: #a8b8d8;
    --text: #1a1f36;
    --sub: #6b7280;
    --border: #e2e6f0;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
  }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── 로그인 ── */
  #loginPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1e2a45, #4f6ef7); }
  .login-box { background: white; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
  .login-box h1 { font-size: 1.8rem; margin-bottom: 8px; }
  .login-box p { color: var(--sub); margin-bottom: 32px; font-size: 0.95rem; }
  .login-box input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1rem; margin-bottom: 12px; outline: none; transition: border-color 0.2s; }
  .login-box input:focus { border-color: var(--primary); }
  .login-box button { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .login-box button:hover { background: var(--primary-d); }
  #loginError { color: var(--danger); font-size: 0.88rem; margin-top: 10px; display: none; }

  /* ── 레이아웃 ── */
  #app { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--sidebar); color: white; display: flex; flex-direction: column; padding: 24px 0; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; overflow-y: auto; }
  .sidebar-logo { padding: 0 24px 24px; font-size: 1.2rem; font-weight: 700; border-bottom: 1px solid #2d3f63; }
  .sidebar nav { margin-top: 16px; flex: 1; }
  .sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 12px 24px; color: var(--sidebar-t); text-decoration: none; font-size: 0.95rem; transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%; }
  .sidebar nav a:hover, .sidebar nav a.active { background: rgba(79,110,247,0.18); color: white; }
  .sidebar-bottom { padding: 16px 24px; border-top: 1px solid #2d3f63; }
  .sidebar-bottom button { background: none; border: 1px solid #2d3f63; color: var(--sidebar-t); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; width: 100%; transition: all 0.2s; }
  .sidebar-bottom button:hover { background: #2d3f63; color: white; }
  .main { margin-left: 220px; flex: 1; padding: 32px; }
  .card { background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px; }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; }
  .btn { padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-d); }
  .btn-danger { background: #fee2e2; color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-outline { background: white; color: var(--text); border: 1.5px solid var(--border); }
  .btn-outline:hover { background: var(--bg); }

  /* ── 브리핑 모달 ── */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: center; justify-content: center; }
  .modal-bg.hidden { display: none; }
  .modal { background: white; border-radius: 20px; padding: 32px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-header h2 { font-size: 1.3rem; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--sub); }
  .briefing-section { margin-bottom: 18px; }
  .briefing-section h4 { font-size: 0.88rem; font-weight: 700; color: var(--sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .briefing-item { padding: 8px 12px; border-radius: 8px; background: var(--bg); font-size: 0.92rem; margin-bottom: 6px; }
  .briefing-item.urgent { background: #fee2e2; color: #991b1b; }
  .briefing-item.ok { background: #dcfce7; color: #166534; }
  .briefing-item.warn { background: #fef3c7; color: #92400e; }

  /* ── 캘린더 ── */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-header h2 { font-size: 1.2rem; font-weight: 700; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button { background: var(--bg); border: none; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 1rem; }
  .cal-nav button:hover { background: var(--border); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-name { text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--sub); padding: 8px 0; }
  .cal-day { min-height: 90px; display: flex; flex-direction: column; border-radius: 10px; cursor: pointer; font-size: 0.9rem; position: relative; transition: background 0.15s; border: 2px solid transparent; padding: 6px; }
  .cal-day:hover { background: var(--bg); }
  .cal-day.today { border-color: var(--primary); }
  .cal-day.today .cal-day-num { color: var(--primary); font-weight: 700; }
  .cal-day.empty { cursor: default; }
  .cal-day.selected { background: #eef1ff; border-color: var(--primary); }
  .cal-day-num { font-size: 0.88rem; font-weight: 600; margin-bottom: 4px; }
  .cal-entry-chip { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: #eef1ff; color: var(--primary); cursor: pointer; }
  .cal-entry-chip.urgent { background: #fee2e2; color: var(--danger); }
  .cal-entry-chip.todo-chip { background: #fef3c7; color: #92400e; }

  /* ── 다이어리 패널 ── */
  .diary-panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .diary-panel-header h3 { font-size: 1rem; font-weight: 700; color: var(--primary); }
  .entry-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .entry-item { border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; }
  .entry-item-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg); cursor: pointer; }
  .entry-item-header:hover { background: var(--border); }
  .entry-title-text { flex: 1; font-weight: 600; font-size: 0.92rem; }
  .entry-item-body { padding: 12px 14px; font-size: 0.92rem; line-height: 1.6; color: var(--text); border-top: 1.5px solid var(--border); display: none; white-space: pre-wrap; }
  .entry-item-body.open { display: block; }
  .entry-delete-btn { background: none; border: none; color: var(--sub); cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 4px; }
  .entry-delete-btn:hover { color: var(--danger); background: #fee2e2; }
  .new-entry-form { border: 1.5px dashed var(--border); border-radius: 10px; padding: 14px; }
  .new-entry-form input[type=text] { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.92rem; outline: none; margin-bottom: 8px; transition: border-color 0.2s; }
  .new-entry-form input[type=text]:focus { border-color: var(--primary); }
  .new-entry-form textarea { width: 100%; min-height: 100px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.92rem; resize: vertical; outline: none; transition: border-color 0.2s; font-family: inherit; margin-bottom: 8px; }
  .new-entry-form textarea:focus { border-color: var(--primary); }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* ── TODO ── */
  .todo-input-area { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; background: var(--bg); border-radius: 12px; padding: 16px; }
  .todo-input-row { display: flex; gap: 8px; }
  .todo-input-row input[type=text] { flex: 1; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; background: white; }
  .todo-input-row input[type=text]:focus { border-color: var(--primary); }
  .todo-meta-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .todo-meta-row input[type=date] { padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.88rem; outline: none; background: white; cursor: pointer; }
  .priority-select { display: flex; gap: 6px; }
  .priority-btn { padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .priority-btn.selected-urgent { background: #fee2e2; border-color: var(--danger); color: var(--danger); }
  .priority-btn.selected-normal { background: #fef3c7; border-color: var(--warning); color: #92400e; }
  .priority-btn.selected-low { background: #dcfce7; border-color: var(--success); color: #166534; }
  .todo-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .todo-filter button { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .todo-filter button.active { background: var(--primary); color: white; border-color: var(--primary); }
  .todo-list { display: flex; flex-direction: column; gap: 8px; }
  .todo-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-radius: 10px; border-left: 4px solid transparent; }
  .todo-item.urgent { border-left-color: var(--danger); }
  .todo-item.normal { border-left-color: var(--warning); }
  .todo-item.low { border-left-color: var(--success); }
  .todo-item.done { opacity: 0.5; }
  .todo-item.done .todo-text { text-decoration: line-through; }
  .todo-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
  .todo-item-info { flex: 1; min-width: 0; }
  .todo-text { font-size: 0.95rem; }
  .todo-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .priority-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .priority-badge.urgent { background: #fee2e2; color: var(--danger); }
  .priority-badge.normal { background: #fef3c7; color: #92400e; }
  .priority-badge.low { background: #dcfce7; color: #166534; }
  .dday-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; background: #eef1ff; color: var(--primary); }
  .dday-badge.overdue { background: #fee2e2; color: var(--danger); }
  .dday-badge.today-due { background: #fef3c7; color: #92400e; }
  .todo-item > button { background: none; border: none; color: var(--sub); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
  .todo-item > button:hover { color: var(--danger); background: #fee2e2; }

  /* ── 자료실 ── */
  .resource-input { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .resource-input input { padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
  .resource-input input:focus { border-color: var(--primary); }
  .resource-list { display: flex; flex-direction: column; gap: 10px; }
  .resource-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--bg); border-radius: 10px; }
  .resource-info { flex: 1; }
  .resource-info a { font-weight: 600; color: var(--primary); text-decoration: none; font-size: 0.95rem; }
  .resource-info a:hover { text-decoration: underline; }
  .resource-info p { font-size: 0.82rem; color: var(--sub); margin-top: 2px; }
  .resource-item button { background: none; border: none; color: var(--sub); cursor: pointer; font-size: 1.1rem; padding: 4px 8px; border-radius: 4px; }
  .resource-item button:hover { color: var(--danger); background: #fee2e2; }

  /* ── 메모장 ── */
  .memo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .memo-card { background: #fffbeb; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); display: flex; flex-direction: column; gap: 10px; border-top: 4px solid var(--warning); }
  .memo-card.color-blue { background: #eff6ff; border-top-color: var(--primary); }
  .memo-card.color-green { background: #f0fdf4; border-top-color: var(--success); }
  .memo-card.color-pink { background: #fdf2f8; border-top-color: #ec4899; }
  .memo-card-title { font-weight: 700; font-size: 0.95rem; border: none; background: transparent; outline: none; width: 100%; }
  .memo-card-content { font-size: 0.88rem; color: var(--text); border: none; background: transparent; outline: none; resize: none; width: 100%; min-height: 80px; font-family: inherit; line-height: 1.6; }
  .memo-card-footer { display: flex; justify-content: space-between; align-items: center; }
  .memo-card-date { font-size: 0.75rem; color: var(--sub); }
  .memo-card-actions { display: flex; gap: 6px; }
  .memo-color-btn { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.15s; }
  .memo-color-btn:hover { transform: scale(1.2); }
  .memo-delete-btn { background: none; border: none; color: var(--sub); cursor: pointer; font-size: 0.9rem; }
  .memo-delete-btn:hover { color: var(--danger); }
  .memo-add-btn { display: flex; align-items: center; justify-content: center; background: var(--bg); border: 2px dashed var(--border); border-radius: 12px; padding: 32px; cursor: pointer; font-size: 2rem; color: var(--sub); transition: all 0.2s; }
  .memo-add-btn:hover { background: var(--border); color: var(--primary); }

  /* ── 주간 리포트 ── */
  .report-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .report-week-nav { display: flex; gap: 8px; align-items: center; }
  .report-week-nav button { background: var(--bg); border: none; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 1rem; }
  .report-week-label { font-weight: 700; font-size: 0.95rem; min-width: 180px; text-align: center; }
  .report-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .report-stat { background: var(--bg); border-radius: 10px; padding: 14px 16px; }
  .report-stat .r-label { font-size: 0.8rem; color: var(--sub); margin-bottom: 4px; }
  .report-stat .r-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
  .report-day { margin-bottom: 14px; }
  .report-day-title { font-size: 0.88rem; font-weight: 700; color: var(--sub); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .report-entry-row { font-size: 0.9rem; padding: 5px 8px; background: var(--bg); border-radius: 6px; margin-bottom: 4px; }
  .report-todo-row { font-size: 0.88rem; padding: 5px 8px; background: #dcfce7; border-radius: 6px; margin-bottom: 4px; color: #166534; }
  .report-todo-row.undone { background: #fef3c7; color: #92400e; }

  /* ── 검색 ── */
  .search-bar { display: flex; gap: 8px; margin-bottom: 24px; }
  .search-bar input { flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 1rem; outline: none; }
  .search-bar input:focus { border-color: var(--primary); }
  .search-result { padding: 16px; background: var(--bg); border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
  .search-result:hover { background: var(--border); }
  .search-result .s-date { font-size: 0.82rem; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
  .search-result .s-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
  .search-result .s-preview { font-size: 0.88rem; color: var(--sub); }
  .search-empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 0.95rem; }

  /* ── 대시보드 ── */
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .stat-card .label { font-size: 0.85rem; color: var(--sub); margin-bottom: 8px; }
  .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
  .recent-list { display: flex; flex-direction: column; gap: 8px; }
  .recent-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: var(--bg); border-radius: 8px; cursor: pointer; }
  .recent-item:hover { background: var(--border); }
  .recent-date { font-size: 0.8rem; color: var(--primary); font-weight: 700; min-width: 80px; }
  .recent-text { font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .toast { position: fixed; bottom: 30px; right: 30px; background: #1e2a45; color: white; padding: 12px 24px; border-radius: 10px; font-size: 0.92rem; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginPage">
  <div class="login-box">
    <h1>📋 업무 다이어리</h1>
    <p>나만의 업무 기록 공간</p>
    <input type="email" id="loginEmail" placeholder="이메일" />
    <input type="password" id="loginPw" placeholder="비밀번호" onkeydown="if(event.key==='Enter') doLogin()" />
    <button onclick="doLogin()">로그인</button>
    <div id="loginError">이메일 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 오늘 브리핑 모달 -->
<div class="modal-bg hidden" id="briefingModal">
  <div class="modal">
    <div class="modal-header">
      <h2>☀️ 오늘의 브리핑</h2>
      <button class="modal-close" onclick="closeBriefing()">✕</button>
    </div>
    <div id="briefingContent"></div>
    <div style="display:flex; justify-content:flex-end; margin-top:16px;">
      <button class="btn btn-primary" onclick="closeBriefing()">확인</button>
    </div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">📋 업무 다이어리</div>
      <nav>
        <a onclick="showPage('dashboard')" id="nav-dashboard">🏠 대시보드</a>
        <a onclick="showPage('calendar')" id="nav-calendar">📅 캘린더</a>
        <a onclick="showPage('todo')" id="nav-todo">✅ TODO</a>
        <a onclick="showPage('memo')" id="nav-memo">📝 메모장</a>
        <a onclick="showPage('resources')" id="nav-resources">🗂️ 자료실</a>
        <a onclick="showPage('report')" id="nav-report">📊 주간 리포트</a>
        <a onclick="showPage('search')" id="nav-search">🔍 검색</a>
      </nav>
      <div class="sidebar-bottom">
        <button onclick="doLogout()">🚪 로그아웃</button>
      </div>
    </aside>
    <main class="main">

      <!-- 대시보드 -->
      <div class="page active" id="page-dashboard">
        <div class="page-title">🏠 대시보드</div>
        <div class="dashboard-grid">
          <div class="stat-card"><div class="label">📝 총 업무 기록</div><div class="value" id="statDiary">0</div></div>
          <div class="stat-card"><div class="label">✅ 완료한 TODO</div><div class="value" id="statTodoDone">0</div></div>
          <div class="stat-card"><div class="label">📌 남은 TODO</div><div class="value" id="statTodoLeft">0</div></div>
          <div class="stat-card"><div class="label">🗂️ 자료</div><div class="value" id="statResource">0</div></div>
        </div>
        <div class="card">
          <div style="font-weight:700; margin-bottom:16px;">📅 최근 업무 기록</div>
          <div class="recent-list" id="recentList"></div>
        </div>
        <div class="card">
          <div style="font-weight:700; margin-bottom:16px;">🔴 긴급 TODO</div>
          <div class="todo-list" id="urgentList"></div>
        </div>
      </div>

      <!-- 캘린더 -->
      <div class="page" id="page-calendar">
        <div class="page-title">📅 캘린더</div>
        <div class="card">
          <div class="cal-header">
            <div class="cal-nav">
              <button onclick="changeMonth(-1)">‹</button>
              <button onclick="changeMonth(1)">›</button>
            </div>
            <h2 id="calTitle"></h2>
            <button class="btn btn-outline" onclick="goToday()">오늘</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="card" id="diaryPanel" style="display:none;">
          <div class="diary-panel-header">
            <h3 id="diaryDateTitle"></h3>
            <button class="btn btn-outline" onclick="closeDiary()">닫기</button>
          </div>
          <div class="entry-list" id="entryList"></div>
          <div class="new-entry-form">
            <input type="text" id="entryTitle" placeholder="제목 (예: 팀 회의, 보고서 작성)" />
            <textarea id="entryContent" placeholder="상세 내용을 입력하세요..."></textarea>
            <div class="form-actions">
              <button class="btn btn-primary" onclick="saveEntry()">+ 추가</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TODO -->
      <div class="page" id="page-todo">
        <div class="page-title">✅ TODO</div>
        <div class="card">
          <div class="todo-input-area">
            <div class="todo-input-row">
              <input type="text" id="todoInput" placeholder="할 일을 입력하세요..." onkeydown="if(event.key==='Enter') addTodo()" />
              <button class="btn btn-primary" onclick="addTodo()">추가</button>
            </div>
            <div class="todo-meta-row">
              <input type="date" id="todoDueDate" />
              <div class="priority-select">
                <button class="priority-btn" id="pBtn-urgent" onclick="selectPriority('urgent')">🔴 긴급</button>
                <button class="priority-btn" id="pBtn-normal" onclick="selectPriority('normal')">🟡 보통</button>
                <button class="priority-btn" id="pBtn-low" onclick="selectPriority('low')">🟢 낮음</button>
              </div>
            </div>
          </div>
          <div class="todo-filter">
            <button class="active" onclick="filterTodo('all',this)">전체</button>
            <button onclick="filterTodo('active',this)">진행중</button>
            <button onclick="filterTodo('done',this)">완료</button>
            <button onclick="filterTodo('urgent',this)">🔴 긴급</button>
          </div>
          <div class="todo-list" id="todoList"></div>
        </div>
      </div>

      <!-- 메모장 -->
      <div class="page" id="page-memo">
        <div class="page-title">📝 메모장</div>
        <div class="memo-grid" id="memoGrid"></div>
      </div>

      <!-- 자료실 -->
      <div class="page" id="page-resources">
        <div class="page-title">🗂️ 자료실</div>
        <div class="card">
          <div class="resource-input">
            <input type="text" id="resTitle" placeholder="자료 제목" />
            <input type="text" id="resUrl" placeholder="링크 URL (iCloud, Google Drive 등)" />
            <input type="text" id="resMemo" placeholder="메모 (선택사항)" />
            <button class="btn btn-primary" onclick="addResource()" style="align-self:flex-end; padding:10px 24px;">추가</button>
          </div>
          <div class="resource-list" id="resourceList"></div>
        </div>
      </div>

      <!-- 주간 리포트 -->
      <div class="page" id="page-report">
        <div class="page-title">📊 주간 리포트</div>
        <div class="card">
          <div class="report-header">
            <div class="report-week-nav">
              <button onclick="changeReportWeek(-1)">‹</button>
              <div class="report-week-label" id="reportWeekLabel"></div>
              <button onclick="changeReportWeek(1)">›</button>
            </div>
            <button class="btn btn-outline" onclick="changeReportWeek(0)">이번 주</button>
          </div>
          <div class="report-stats" id="reportStats"></div>
          <div id="reportBody"></div>
        </div>
      </div>

      <!-- 검색 -->
      <div class="page" id="page-search">
        <div class="page-title">🔍 검색</div>
        <div class="card">
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="업무 제목, 내용, 자료 검색..." onkeydown="if(event.key==='Enter') doSearch()" />
            <button class="btn btn-primary" onclick="doSearch()">검색</button>
          </div>
          <div id="searchResults"><div class="search-empty">검색어를 입력해주세요.</div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, orderBy, addDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ✅ 여기에 본인의 firebaseConfig 붙여넣기
  const firebaseConfig = {
    apiKey: "AIzaSyAFzdgG6ySULT0nwnasWjuJbXWE5LVe-Qk",
    authDomain: "project-hq-2f6d8.firebaseapp.com",
    projectId: "project-hq-2f6d8",
    storageBucket: "project-hq-2f6d8.firebasestorage.app",
    messagingSenderId: "418542134409",
    appId: "1:418542134409:web:f0068790cc6ef3a8329258"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentDate = null;
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let diaryEntries = {};
  let todos = [];
  let resources = [];
  let memos = [];
  let todoFilter = 'all';
  let selectedPriority = 'normal';
  let reportWeekOffset = 0;

  // ── 인증 ──
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      await loadAll();
      renderCalendar();
      renderDashboard();
      showPage('dashboard');
      showBriefing();
    } else {
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  window.doLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    try { await signInWithEmailAndPassword(auth, email, pw); }
    catch(e) { err.style.display = 'block'; }
  };
  window.doLogout = async () => { await signOut(auth); };

  // ── 데이터 로드 ──
  async function loadAll() {
    await Promise.all([loadDiaries(), loadTodos(), loadResources(), loadMemos()]);
  }

  async function loadDiaries() {
    diaryEntries = {};
    const snap = await getDocs(collection(db, `users/${currentUser.uid}/diaries`));
    snap.forEach(d => {
      const data = d.data();
      if (!diaryEntries[data.date]) diaryEntries[data.date] = [];
      diaryEntries[data.date].push({ id: d.id, ...data });
    });
  }

  async function loadTodos() {
    todos = [];
    const q = query(collection(db, `users/${currentUser.uid}/todos`), orderBy('createdAt'));
    const snap = await getDocs(q);
    snap.forEach(d => todos.push({ id: d.id, ...d.data() }));
    renderTodos();
  }

  async function loadResources() {
    resources = [];
    const q = query(collection(db, `users/${currentUser.uid}/resources`), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    snap.forEach(d => resources.push({ id: d.id, ...d.data() }));
    renderResources();
  }

  async function loadMemos() {
    memos = [];
    const q = query(collection(db, `users/${currentUser.uid}/memos`), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    snap.forEach(d => memos.push({ id: d.id, ...d.data() }));
    renderMemos();
  }

  // ── 브리핑 ──
  function showBriefing() {
    const today = getTodayKey();
    const todayTodos = todos.filter(t => t.dueDate === today && !t.done);
    const urgentTodos = todos.filter(t => t.priority === 'urgent' && !t.done);
    const overdueTodos = todos.filter(t => {
      if (!t.dueDate || t.done) return false;
      return getDday(t.dueDate) < 0;
    });
    const hasEntry = !!(diaryEntries[today] && diaryEntries[today].length);

    let html = '';

    // 오늘 날짜
    html += `<div class="briefing-section">
      <h4>📅 오늘</h4>
      <div class="briefing-item ok">${today} (${['일','월','화','수','목','금','토'][new Date().getDay()]}요일)</div>
    </div>`;

    // 업무 기록 여부
    html += `<div class="briefing-section">
      <h4>📝 오늘 업무 기록</h4>
      <div class="briefing-item ${hasEntry ? 'ok' : 'warn'}">${hasEntry ? `✅ ${diaryEntries[today].length}개 기록 있음` : '⚠️ 아직 오늘 업무 기록이 없어요!'}</div>
    </div>`;

    // 오늘 마감 TODO
    if (todayTodos.length) {
      html += `<div class="briefing-section"><h4>📌 오늘 마감 TODO</h4>`;
      todayTodos.forEach(t => {
        html += `<div class="briefing-item ${t.priority === 'urgent' ? 'urgent' : 'warn'}">${t.priority === 'urgent' ? '🔴' : '🟡'} ${t.text}</div>`;
      });
      html += `</div>`;
    }

    // 긴급 항목
    if (urgentTodos.length) {
      html += `<div class="briefing-section"><h4>🔴 미완료 긴급 TODO</h4>`;
      urgentTodos.forEach(t => {
        html += `<div class="briefing-item urgent">🔴 ${t.text}${t.dueDate ? ` (${renderDdayText(t.dueDate)})` : ''}</div>`;
      });
      html += `</div>`;
    }

    // 기한 초과
    if (overdueTodos.length) {
      html += `<div class="briefing-section"><h4>⚠️ 기한 초과 TODO</h4>`;
      overdueTodos.forEach(t => {
        html += `<div class="briefing-item urgent">⏰ ${t.text} (${renderDdayText(t.dueDate)})</div>`;
      });
      html += `</div>`;
    }

    if (!todayTodos.length && !urgentTodos.length && !overdueTodos.length && hasEntry) {
      html += `<div class="briefing-item ok" style="margin-top:8px;">🎉 오늘 할 일도 없고 기록도 완료! 좋은 하루예요!</div>`;
    }

    document.getElementById('briefingContent').innerHTML = html;
    document.getElementById('briefingModal').classList.remove('hidden');
  }

  window.closeBriefing = () => {
    document.getElementById('briefingModal').classList.add('hidden');
  };

  // ── 캘린더 ──
  window.changeMonth = (dir) => {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    else if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  };
  window.goToday = () => {
    calYear = new Date().getFullYear(); calMonth = new Date().getMonth(); renderCalendar();
  };

  function renderCalendar() {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('calTitle').textContent = `${calYear}년 ${months[calMonth]}`;
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['일','월','화','수','목','금','토'].forEach(d => {
      const el = document.createElement('div'); el.className = 'cal-day-name'; el.textContent = d; grid.appendChild(el);
    });
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    const today = new Date();
    for (let i = 0; i < first; i++) {
      const el = document.createElement('div'); el.className = 'cal-day empty'; grid.appendChild(el);
    }
    for (let d = 1; d <= days; d++) {
      const el = document.createElement('div'); el.className = 'cal-day';
      const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if (today.getFullYear()===calYear && today.getMonth()===calMonth && today.getDate()===d) el.classList.add('today');
      if (currentDate === key) el.classList.add('selected');
      const numEl = document.createElement('div'); numEl.className = 'cal-day-num'; numEl.textContent = d;
      el.appendChild(numEl);
      (diaryEntries[key] || []).slice(0, 2).forEach(entry => {
        const chip = document.createElement('div'); chip.className = 'cal-entry-chip';
        chip.textContent = entry.title;
        chip.onclick = e => { e.stopPropagation(); openDiary(key); };
        el.appendChild(chip);
      });
      if ((diaryEntries[key] || []).length > 2) {
        const more = document.createElement('div'); more.className = 'cal-entry-chip';
        more.style.cssText = 'background:#f3f4f6;color:#6b7280;';
        more.textContent = `+${(diaryEntries[key] || []).length - 2}개 더`;
        el.appendChild(more);
      }
      todos.filter(t => t.dueDate === key && !t.done).slice(0, 1).forEach(t => {
        const chip = document.createElement('div');
        chip.className = `cal-entry-chip todo-chip ${t.priority === 'urgent' ? 'urgent' : ''}`;
        chip.textContent = `📌 ${t.text.length > 8 ? t.text.substring(0,8)+'...' : t.text}`;
        chip.onclick = e => { e.stopPropagation(); showPage('todo'); };
        el.appendChild(chip);
      });
      const todoCnt = todos.filter(t => t.dueDate === key && !t.done).length;
      if (todoCnt > 1) {
        const more = document.createElement('div'); more.className = 'cal-entry-chip todo-chip';
        more.textContent = `+${todoCnt - 1}개 마감`;
        el.appendChild(more);
      }
      el.onclick = () => openDiary(key);
      grid.appendChild(el);
    }
  }

  window.openDiary = (key) => {
    currentDate = key;
    renderCalendar();
    const panel = document.getElementById('diaryPanel');
    panel.style.display = 'block';
    document.getElementById('diaryDateTitle').textContent = `📝 ${key}`;
    document.getElementById('entryTitle').value = '';
    document.getElementById('entryContent').value = '';
    renderEntryList();
    panel.scrollIntoView({ behavior: 'smooth' });
  };
  window.closeDiary = () => {
    document.getElementById('diaryPanel').style.display = 'none';
    currentDate = null; renderCalendar();
  };

  function renderEntryList() {
    const list = document.getElementById('entryList');
    const entries = diaryEntries[currentDate] || [];
    if (!entries.length) { list.innerHTML = '<div class="search-empty" style="padding:12px 0;">아직 기록이 없어요. 아래에서 추가해보세요!</div>'; return; }
    list.innerHTML = entries.map(e => `
      <div class="entry-item">
        <div class="entry-item-header" onclick="toggleEntry('${e.id}')">
          <span class="entry-title-text">📄 ${e.title}</span>
          <button class="entry-delete-btn" onclick="event.stopPropagation(); deleteEntry('${e.id}')">✕</button>
        </div>
        <div class="entry-item-body" id="body-${e.id}">${e.content}</div>
      </div>`).join('');
  }

  window.toggleEntry = (id) => {
    const body = document.getElementById(`body-${id}`);
    if (body) body.classList.toggle('open');
  };

  window.saveEntry = async () => {
    if (!currentDate) return;
    const title = document.getElementById('entryTitle').value.trim();
    const content = document.getElementById('entryContent').value.trim();
    if (!title) return showToast('제목을 입력해주세요.');
    if (!content) return showToast('내용을 입력해주세요.');
    const ref = await addDoc(collection(db, `users/${currentUser.uid}/diaries`), { date: currentDate, title, content, createdAt: new Date().toISOString() });
    if (!diaryEntries[currentDate]) diaryEntries[currentDate] = [];
    diaryEntries[currentDate].push({ id: ref.id, date: currentDate, title, content });
    document.getElementById('entryTitle').value = '';
    document.getElementById('entryContent').value = '';
    renderEntryList(); renderCalendar(); renderDashboard();
    showToast('✅ 저장되었습니다!');
  };

  window.deleteEntry = async (id) => {
    if (!confirm('삭제할까요?')) return;
    await deleteDoc(doc(db, `users/${currentUser.uid}/diaries`, id));
    diaryEntries[currentDate] = diaryEntries[currentDate].filter(e => e.id !== id);
    if (!diaryEntries[currentDate].length) delete diaryEntries[currentDate];
    renderEntryList(); renderCalendar(); renderDashboard();
    showToast('🗑️ 삭제되었습니다.');
  };

  // ── TODO ──
  window.selectPriority = (p) => {
    selectedPriority = p;
    ['urgent','normal','low'].forEach(k => {
      const btn = document.getElementById(`pBtn-${k}`);
      btn.className = 'priority-btn';
      if (k === p) btn.classList.add(`selected-${k}`);
    });
  };
  selectPriority('normal');

  window.addTodo = async () => {
    const input = document.getElementById('todoInput');
    const text = input.value.trim();
    const dueDate = document.getElementById('todoDueDate').value;
    if (!text) return;
    const id = Date.now().toString();
    const todo = { text, done: false, priority: selectedPriority, dueDate: dueDate || '', createdAt: new Date().toISOString() };
    await setDoc(doc(db, `users/${currentUser.uid}/todos`, id), todo);
    todos.push({ id, ...todo });
    input.value = ''; document.getElementById('todoDueDate').value = '';
    selectPriority('normal'); renderTodos(); renderCalendar(); renderDashboard();
    showToast('✅ 추가되었습니다!');
  };

  window.toggleTodo = async (id) => {
    const todo = todos.find(t => t.id === id); if (!todo) return;
    todo.done = !todo.done;
    await setDoc(doc(db, `users/${currentUser.uid}/todos`, id), todo);
    renderTodos(); renderDashboard();
  };

  window.deleteTodo = async (id) => {
    await deleteDoc(doc(db, `users/${currentUser.uid}/todos`, id));
    todos = todos.filter(t => t.id !== id);
    renderTodos(); renderCalendar(); renderDashboard();
    showToast('🗑️ 삭제되었습니다.');
  };

  window.filterTodo = (f, btn) => {
    todoFilter = f;
    document.querySelectorAll('.todo-filter button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active'); renderTodos();
  };

  function getDday(dueDate) {
    if (!dueDate) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(dueDate); due.setHours(0,0,0,0);
    return Math.round((due - today) / (1000*60*60*24));
  }

  function renderDdayText(dueDate) {
    const diff = getDday(dueDate);
    if (diff === null) return '';
    if (diff < 0) return `D+${Math.abs(diff)} 초과`;
    if (diff === 0) return 'D-Day';
    return `D-${diff}`;
  }

  function renderDdayBadge(dueDate) {
    if (!dueDate) return '';
    const diff = getDday(dueDate);
    let cls = 'dday-badge';
    if (diff < 0) cls += ' overdue';
    else if (diff === 0) cls += ' today-due';
    return `<span class="${cls}">${renderDdayText(dueDate)} (${dueDate})</span>`;
  }

  function renderTodos() {
    const list = document.getElementById('todoList');
    let filtered = [...todos];
    if (todoFilter === 'active') filtered = todos.filter(t => !t.done);
    if (todoFilter === 'done') filtered = todos.filter(t => t.done);
    if (todoFilter === 'urgent') filtered = todos.filter(t => t.priority === 'urgent' && !t.done);
    if (!filtered.length) { list.innerHTML = '<div class="search-empty">항목이 없습니다 🎉</div>'; return; }
    const pl = { urgent: '🔴 긴급', normal: '🟡 보통', low: '🟢 낮음' };
    list.innerHTML = filtered.map(t => `
      <div class="todo-item ${t.priority} ${t.done ? 'done' : ''}">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo('${t.id}')" />
        <div class="todo-item-info">
          <div class="todo-text">${t.text}</div>
          <div class="todo-meta">
            <span class="priority-badge ${t.priority}">${pl[t.priority]}</span>
            ${renderDdayBadge(t.dueDate)}
          </div>
        </div>
        <button onclick="deleteTodo('${t.id}')">✕</button>
      </div>`).join('');
  }

  // ── 메모장 ──
  const memoColors = ['yellow', 'blue', 'green', 'pink'];
  const colorMap = { yellow: '', blue: 'color-blue', green: 'color-green', pink: 'color-pink' };
  const colorHex = { yellow: '#f59e0b', blue: '#4f6ef7', green: '#22c55e', pink: '#ec4899' };

  window.addMemo = async () => {
    const id = Date.now().toString();
    const memo = { title: '', content: '', color: 'yellow', createdAt: new Date().toISOString() };
    await setDoc(doc(db, `users/${currentUser.uid}/memos`, id), memo);
    memos.unshift({ id, ...memo });
    renderMemos();
  };

  window.saveMemo = async (id) => {
    const memo = memos.find(m => m.id === id); if (!memo) return;
    memo.title = document.getElementById(`mTitle-${id}`).value;
    memo.content = document.getElementById(`mContent-${id}`).value;
    await setDoc(doc(db, `users/${currentUser.uid}/memos`, id), memo);
    showToast('✅ 메모 저장됨!');
  };

  window.changeMemoColor = async (id, color) => {
    const memo = memos.find(m => m.id === id); if (!memo) return;
    memo.color = color;
    await setDoc(doc(db, `users/${currentUser.uid}/memos`, id), memo);
    renderMemos();
  };

  window.deleteMemo = async (id) => {
    if (!confirm('메모를 삭제할까요?')) return;
    await deleteDoc(doc(db, `users/${currentUser.uid}/memos`, id));
    memos = memos.filter(m => m.id !== id);
    renderMemos(); showToast('🗑️ 삭제되었습니다.');
  };

  function renderMemos() {
    const grid = document.getElementById('memoGrid');
    let html = memos.map(m => `
      <div class="memo-card ${colorMap[m.color] || ''}">
        <input class="memo-card-title" id="mTitle-${m.id}" value="${m.title}" placeholder="제목" onblur="saveMemo('${m.id}')" />
        <textarea class="memo-card-content" id="mContent-${m.id}" placeholder="자유롭게 메모하세요..." onblur="saveMemo('${m.id}')">${m.content}</textarea>
        <div class="memo-card-footer">
          <span class="memo-card-date">${m.createdAt ? m.createdAt.substring(0,10) : ''}</span>
          <div class="memo-card-actions">
            ${memoColors.map(c => `<div class="memo-color-btn" style="background:${colorHex[c]};${m.color===c?'border-color:#333;transform:scale(1.2);':''}" onclick="changeMemoColor('${m.id}','${c}')"></div>`).join('')}
            <button class="memo-delete-btn" onclick="deleteMemo('${m.id}')">🗑️</button>
          </div>
        </div>
      </div>`).join('');
    html += `<div class="memo-add-btn" onclick="addMemo()">+</div>`;
    grid.innerHTML = html;
  }

  // ── 주간 리포트 ──
  function getWeekRange(offset) {
    const today = new Date(); today.setHours(0,0,0,0);
    const day = today.getDay();
    const mon = new Date(today); mon.setDate(today.getDate() - day + 1 + offset * 7);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { mon, sun };
  }

  function dateToKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  window.changeReportWeek = (dir) => {
    if (dir === 0) reportWeekOffset = 0;
    else reportWeekOffset += dir;
    renderReport();
  };

  function renderReport() {
    const { mon, sun } = getWeekRange(reportWeekOffset);
    const monKey = dateToKey(mon); const sunKey = dateToKey(sun);
    document.getElementById('reportWeekLabel').textContent = `${monKey} ~ ${sunKey}`;

    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      days.push(d);
    }

    const dayNames = ['일','월','화','수','목','금','토'];
    let totalEntries = 0; let doneTodos = 0; let undoneTodos = 0;

    let bodyHtml = '';
    days.forEach(d => {
      const key = dateToKey(d);
      const entries = diaryEntries[key] || [];
      const dayTodos = todos.filter(t => t.dueDate === key);
      totalEntries += entries.length;
      doneTodos += dayTodos.filter(t => t.done).length;
      undoneTodos += dayTodos.filter(t => !t.done).length;
      if (!entries.length && !dayTodos.length) return;
      bodyHtml += `<div class="report-day">
        <div class="report-day-title">${key} (${dayNames[d.getDay()]})</div>
        ${entries.map(e => `<div class="report-entry-row">📄 ${e.title}</div>`).join('')}
        ${dayTodos.map(t => `<div class="report-todo-row ${t.done ? '' : 'undone'}">${t.done ? '✅' : '⬜'} ${t.text}</div>`).join('')}
      </div>`;
    });

    document.getElementById('reportStats').innerHTML = `
      <div class="report-stat"><div class="r-label">📝 업무 기록</div><div class="r-value">${totalEntries}</div></div>
      <div class="report-stat"><div class="r-label">✅ 완료 TODO</div><div class="r-value">${doneTodos}</div></div>
      <div class="report-stat"><div class="r-label">📌 미완료 TODO</div><div class="r-value">${undoneTodos}</div></div>
      <div class="report-stat"><div class="r-label">📅 기록한 날</div><div class="r-value">${days.filter(d => (diaryEntries[dateToKey(d)] || []).length > 0).length}일</div></div>`;
    document.getElementById('reportBody').innerHTML = bodyHtml || '<div class="search-empty">이번 주 기록이 없습니다.</div>';
  }

  // ── 자료실 ──
  window.addResource = async () => {
    const title = document.getElementById('resTitle').value.trim();
    const url = document.getElementById('resUrl').value.trim();
    const memo = document.getElementById('resMemo').value.trim();
    if (!title || !url) return showToast('제목과 링크를 입력해주세요.');
    const id = Date.now().toString();
    const res = { title, url, memo, createdAt: new Date().toISOString() };
    await setDoc(doc(db, `users/${currentUser.uid}/resources`, id), res);
    resources.unshift({ id, ...res });
    document.getElementById('resTitle').value = '';
    document.getElementById('resUrl').value = '';
    document.getElementById('resMemo').value = '';
    renderResources(); renderDashboard(); showToast('✅ 추가되었습니다!');
  };

  window.deleteResource = async (id) => {
    if (!confirm('삭제할까요?')) return;
    await deleteDoc(doc(db, `users/${currentUser.uid}/resources`, id));
    resources = resources.filter(r => r.id !== id);
    renderResources(); renderDashboard(); showToast('🗑️ 삭제되었습니다.');
  };

  function renderResources() {
    const list = document.getElementById('resourceList');
    if (!resources.length) { list.innerHTML = '<div class="search-empty">자료가 없습니다.</div>'; return; }
    list.innerHTML = resources.map(r => `
      <div class="resource-item">
        <div class="resource-info">
          <a href="${r.url}" target="_blank">🔗 ${r.title}</a>
          <p>${r.memo || ''}</p>
        </div>
        <button onclick="deleteResource('${r.id}')">✕</button>
      </div>`).join('');
  }

  // ── 검색 ──
  window.doSearch = () => {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const results = document.getElementById('searchResults');
    if (!q) { results.innerHTML = '<div class="search-empty">검색어를 입력해주세요.</div>'; return; }
    let html = '';
    Object.entries(diaryEntries).sort((a,b) => b[0].localeCompare(a[0])).forEach(([date, entries]) => {
      entries.forEach(e => {
        if (e.title.toLowerCase().includes(q) || e.content.toLowerCase().includes(q)) {
          html += `<div class="search-result" onclick="goToDiary('${date}')">
            <div class="s-date">📅 ${date}</div>
            <div class="s-title">${e.title}</div>
            <div class="s-preview">${e.content.substring(0,80)}${e.content.length>80?'...':''}</div>
          </div>`;
        }
      });
    });
    resources.filter(r => r.title.toLowerCase().includes(q) || (r.memo||'').toLowerCase().includes(q)).forEach(r => {
      html += `<div class="search-result">
        <div class="s-date">🗂️ 자료실</div>
        <div class="s-title"><a href="${r.url}" target="_blank">${r.title}</a></div>
        <div class="s-preview">${r.memo || ''}</div>
      </div>`;
    });
    results.innerHTML = html || '<div class="search-empty">검색 결과가 없습니다.</div>';
  };

  window.goToDiary = (date) => {
    const [y, m] = date.split('-');
    calYear = parseInt(y); calMonth = parseInt(m) - 1;
    showPage('calendar');
    setTimeout(() => openDiary(date), 100);
  };

  // ── 대시보드 ──
  function renderDashboard() {
    const total = Object.values(diaryEntries).reduce((s, a) => s + a.length, 0);
    document.getElementById('statDiary').textContent = total;
    document.getElementById('statTodoDone').textContent = todos.filter(t => t.done).length;
    document.getElementById('statTodoLeft').textContent = todos.filter(t => !t.done).length;
    document.getElementById('statResource').textContent = resources.length;
    const allEntries = Object.entries(diaryEntries).sort((a,b) => b[0].localeCompare(a[0])).flatMap(([date, entries]) => entries.map(e => ({ date, title: e.title || '(제목 없음)', ...e }))).slice(0, 5);
    document.getElementById('recentList').innerHTML = allEntries.length
      ? allEntries.map(e => `<div class="recent-item" onclick="goToDiary('${e.date}')"><div class="recent-date">${e.date}</div><div class="recent-text">${e.title || '(제목 없음)'}</div></div>`).join('')
      : '<div class="search-empty">기록이 없습니다.</div>';
    const urgent = todos.filter(t => t.priority === 'urgent' && !t.done);
    const pl = { urgent: '🔴 긴급', normal: '🟡 보통', low: '🟢 낮음' };
    document.getElementById('urgentList').innerHTML = urgent.length
      ? urgent.map(t => `<div class="todo-item urgent"><input type="checkbox" onchange="toggleTodo('${t.id}')"/><div class="todo-item-info"><div class="todo-text">${t.text}</div><div class="todo-meta"><span class="priority-badge urgent">${pl.urgent}</span>${renderDdayBadge(t.dueDate)}</div></div></div>`).join('')
      : '<div class="search-empty">긴급 항목이 없습니다.</div>';
  }

  // ── 유틸 ──
  function getTodayKey() {
    const t = new Date();
    return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
  }

  // ── 페이지 전환 ──
  window.showPage = (name) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
    document.getElementById(`page-${name}`).classList.add('active');
    document.getElementById(`nav-${name}`).classList.add('active');
    if (name === 'dashboard') renderDashboard();
    if (name === 'calendar') renderCalendar();
    if (name === 'report') renderReport();
    if (name === 'memo') renderMemos();
  };

  window.showToast = (msg) => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  };
</script>
</body>
</html>

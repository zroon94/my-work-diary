<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📋 나의 업무 다이어리</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4f6ef7;
    --primary-d: #3a56d4;
    --bg: #f0f2f8;
    --card: #ffffff;
    --sidebar: #1e2a45;
    --sidebar-t: #a8b8d8;
    --text: #1a1f36;
    --sub: #6b7280;
    --border: #e2e6f0;
    --danger: #ef4444;
    --success: #22c55e;
  }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── 로그인 ── */
  #loginPage {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(135deg, #1e2a45, #4f6ef7);
  }
  .login-box {
    background: white; border-radius: 16px; padding: 48px 40px;
    width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .login-box h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--text); }
  .login-box p { color: var(--sub); margin-bottom: 32px; font-size: 0.95rem; }
  .login-box input {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 1rem; margin-bottom: 12px; outline: none;
    transition: border-color 0.2s;
  }
  .login-box input:focus { border-color: var(--primary); }
  .login-box button {
    width: 100%; padding: 13px; background: var(--primary); color: white;
    border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s; margin-top: 4px;
  }
  .login-box button:hover { background: var(--primary-d); }
  #loginError { color: var(--danger); font-size: 0.88rem; margin-top: 10px; display: none; }

  /* ── 레이아웃 ── */
  #app { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; background: var(--sidebar); color: white;
    display: flex; flex-direction: column; padding: 24px 0; position: fixed;
    top: 0; left: 0; height: 100vh; z-index: 100;
  }
  .sidebar-logo { padding: 0 24px 24px; font-size: 1.2rem; font-weight: 700; border-bottom: 1px solid #2d3f63; }
  .sidebar-logo span { font-size: 1.4rem; }
  .sidebar nav { margin-top: 16px; flex: 1; }
  .sidebar nav a {
    display: flex; align-items: center; gap: 10px; padding: 12px 24px;
    color: var(--sidebar-t); text-decoration: none; font-size: 0.95rem;
    transition: all 0.2s; cursor: pointer; border: none; background: none; width: 100%;
  }
  .sidebar nav a:hover, .sidebar nav a.active {
    background: rgba(79,110,247,0.18); color: white;
  }
  .sidebar-bottom { padding: 16px 24px; border-top: 1px solid #2d3f63; }
  .sidebar-bottom button {
    background: none; border: 1px solid #2d3f63; color: var(--sidebar-t);
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.88rem;
    width: 100%; transition: all 0.2s;
  }
  .sidebar-bottom button:hover { background: #2d3f63; color: white; }
  .main { margin-left: 220px; flex: 1; padding: 32px; }

  /* ── 공통 카드 ── */
  .card { background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px; }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; }

  /* ── 캘린더 ── */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-header h2 { font-size: 1.2rem; font-weight: 700; }
  .cal-nav { display: flex; gap: 8px; }
  .cal-nav button {
    background: var(--bg); border: none; border-radius: 8px;
    padding: 6px 14px; cursor: pointer; font-size: 1rem; transition: background 0.2s;
  }
  .cal-nav button:hover { background: var(--border); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-name { text-align: center; font-size: 0.8rem; font-weight: 600; color: var(--sub); padding: 8px 0; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; border-radius: 10px; cursor: pointer;
    font-size: 0.9rem; position: relative; transition: background 0.15s;
    border: 2px solid transparent;
  }
  .cal-day:hover { background: var(--bg); }
  .cal-day.today { border-color: var(--primary); color: var(--primary); font-weight: 700; }
  .cal-day.has-entry::after {
    content: ''; position: absolute; bottom: 5px; width: 5px; height: 5px;
    background: var(--primary); border-radius: 50%;
  }
  .cal-day.empty { cursor: default; }
  .cal-day.selected { background: var(--primary); color: white; }
  .cal-day.selected::after { background: white; }

  /* ── 다이어리 작성 ── */
  .diary-panel { margin-top: 24px; }
  .diary-panel h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; color: var(--primary); }
  .diary-panel textarea {
    width: 100%; min-height: 160px; padding: 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 0.95rem; resize: vertical; outline: none;
    transition: border-color 0.2s; font-family: inherit;
  }
  .diary-panel textarea:focus { border-color: var(--primary); }
  .diary-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  .btn { padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-d); }
  .btn-danger { background: #fee2e2; color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: white; }
  .btn-outline { background: white; color: var(--text); border: 1.5px solid var(--border); }
  .btn-outline:hover { background: var(--bg); }

  /* ── TODO ── */
  .todo-input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .todo-input-row input {
    flex: 1; padding: 11px 14px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
  }
  .todo-input-row input:focus { border-color: var(--primary); }
  .todo-list { display: flex; flex-direction: column; gap: 8px; }
  .todo-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    background: var(--bg); border-radius: 10px; transition: opacity 0.2s;
  }
  .todo-item.done { opacity: 0.5; }
  .todo-item.done span { text-decoration: line-through; }
  .todo-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
  .todo-item span { flex: 1; font-size: 0.95rem; }
  .todo-item button { background: none; border: none; color: var(--sub); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; }
  .todo-item button:hover { color: var(--danger); background: #fee2e2; }
  .todo-filter { display: flex; gap: 8px; margin-bottom: 16px; }
  .todo-filter button { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: white; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
  .todo-filter button.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* ── 자료실 ── */
  .resource-input { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .resource-input input {
    padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 0.95rem; outline: none; transition: border-color 0.2s;
  }
  .resource-input input:focus { border-color: var(--primary); }
  .resource-list { display: flex; flex-direction: column; gap: 10px; }
  .resource-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: var(--bg); border-radius: 10px;
  }
  .resource-icon { font-size: 1.5rem; }
  .resource-info { flex: 1; }
  .resource-info a { font-weight: 600; color: var(--primary); text-decoration: none; font-size: 0.95rem; }
  .resource-info a:hover { text-decoration: underline; }
  .resource-info p { font-size: 0.82rem; color: var(--sub); margin-top: 2px; }
  .resource-item button { background: none; border: none; color: var(--sub); cursor: pointer; font-size: 1.1rem; padding: 4px 8px; border-radius: 4px; }
  .resource-item button:hover { color: var(--danger); background: #fee2e2; }

  /* ── 검색 ── */
  .search-bar { display: flex; gap: 8px; margin-bottom: 24px; }
  .search-bar input {
    flex: 1; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 1rem; outline: none; transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--primary); }
  .search-result { padding: 16px; background: var(--bg); border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: background 0.15s; }
  .search-result:hover { background: var(--border); }
  .search-result .date { font-size: 0.82rem; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
  .search-result .preview { font-size: 0.92rem; color: var(--text); }
  .search-empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 0.95rem; }

  /* ── 대시보드 ── */
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 20px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .stat-card .label { font-size: 0.85rem; color: var(--sub); margin-bottom: 8px; }
  .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
  .recent-list { display: flex; flex-direction: column; gap: 8px; }
  .recent-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: var(--bg); border-radius: 8px; cursor: pointer; }
  .recent-item:hover { background: var(--border); }
  .recent-date { font-size: 0.8rem; color: var(--primary); font-weight: 700; min-width: 70px; }
  .recent-text { font-size: 0.9rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .toast {
    position: fixed; bottom: 30px; right: 30px; background: #1e2a45; color: white;
    padding: 12px 24px; border-radius: 10px; font-size: 0.92rem; z-index: 9999;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginPage">
  <div class="login-box">
    <h1>📋 업무 다이어리</h1>
    <p>나만의 업무 기록 공간</p>
    <input type="email" id="loginEmail" placeholder="이메일" />
    <input type="password" id="loginPw" placeholder="비밀번호" />
    <button onclick="doLogin()">로그인</button>
    <div id="loginError">이메일 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><span>📋</span> 업무 다이어리</div>
      <nav>
        <a onclick="showPage('dashboard')" id="nav-dashboard">🏠 대시보드</a>
        <a onclick="showPage('calendar')" id="nav-calendar">📅 캘린더</a>
        <a onclick="showPage('todo')" id="nav-todo">✅ TODO</a>
        <a onclick="showPage('resources')" id="nav-resources">🗂️ 자료실</a>
        <a onclick="showPage('search')" id="nav-search">🔍 검색</a>
      </nav>
      <div class="sidebar-bottom">
        <button onclick="doLogout()">🚪 로그아웃</button>
      </div>
    </aside>
    <main class="main">

      <!-- 대시보드 -->
      <div class="page active" id="page-dashboard">
        <div class="page-title">🏠 대시보드</div>
        <div class="dashboard-grid">
          <div class="stat-card"><div class="label">📝 총 업무 기록</div><div class="value" id="statDiary">0</div></div>
          <div class="stat-card"><div class="label">✅ 완료한 TODO</div><div class="value" id="statTodoDone">0</div></div>
          <div class="stat-card"><div class="label">📌 남은 TODO</div><div class="value" id="statTodoLeft">0</div></div>
          <div class="stat-card"><div class="label">🗂️ 자료</div><div class="value" id="statResource">0</div></div>
        </div>
        <div class="card">
          <div style="font-weight:700; margin-bottom:16px;">📅 최근 업무 기록</div>
          <div class="recent-list" id="recentList"><div class="search-empty">기록이 없습니다.</div></div>
        </div>
      </div>

      <!-- 캘린더 -->
      <div class="page" id="page-calendar">
        <div class="page-title">📅 캘린더</div>
        <div class="card">
          <div class="cal-header">
            <div class="cal-nav">
              <button onclick="changeMonth(-1)">‹</button>
              <button onclick="changeMonth(1)">›</button>
            </div>
            <h2 id="calTitle"></h2>
            <button class="btn btn-outline" onclick="goToday()">오늘</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="card diary-panel" id="diaryPanel" style="display:none;">
          <h3 id="diaryDateTitle"></h3>
          <textarea id="diaryText" placeholder="오늘의 업무 내용을 기록하세요..."></textarea>
          <div class="diary-actions">
            <button class="btn btn-danger" onclick="deleteEntry()" id="deleteDiaryBtn" style="display:none;">삭제</button>
            <button class="btn btn-outline" onclick="closeDiary()">닫기</button>
            <button class="btn btn-primary" onclick="saveEntry()">저장</button>
          </div>
        </div>
      </div>

      <!-- TODO -->
      <div class="page" id="page-todo">
        <div class="page-title">✅ TODO</div>
        <div class="card">
          <div class="todo-input-row">
            <input type="text" id="todoInput" placeholder="할 일을 입력하세요..." onkeydown="if(event.key==='Enter') addTodo()" />
            <button class="btn btn-primary" onclick="addTodo()">추가</button>
          </div>
          <div class="todo-filter">
            <button class="active" onclick="filterTodo('all', this)">전체</button>
            <button onclick="filterTodo('active', this)">진행중</button>
            <button onclick="filterTodo('done', this)">완료</button>
          </div>
          <div class="todo-list" id="todoList"></div>
        </div>
      </div>

      <!-- 자료실 -->
      <div class="page" id="page-resources">
        <div class="page-title">🗂️ 자료실</div>
        <div class="card">
          <div class="resource-input">
            <input type="text" id="resTitle" placeholder="자료 제목" />
            <input type="text" id="resUrl" placeholder="링크 URL (iCloud, Google Drive 등)" />
            <input type="text" id="resMemo" placeholder="메모 (선택사항)" />
            <button class="btn btn-primary" onclick="addResource()" style="align-self:flex-end; padding: 10px 24px;">추가</button>
          </div>
          <div class="resource-list" id="resourceList"></div>
        </div>
      </div>

      <!-- 검색 -->
      <div class="page" id="page-search">
        <div class="page-title">🔍 검색</div>
        <div class="card">
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="업무 내용, 자료 검색..." onkeydown="if(event.key==='Enter') doSearch()" />
            <button class="btn btn-primary" onclick="doSearch()">검색</button>
          </div>
          <div id="searchResults"><div class="search-empty">검색어를 입력해주세요.</div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ✅ 여기에 본인의 firebaseConfig 붙여넣기
  const firebaseConfig = {
    apiKey: "AIzaSyAFzdgG6ySULT0nwnasWjuJbXWE5LVe-Qk",
    authDomain: "project-hq-2f6d8.firebaseapp.com",
    projectId: "project-hq-2f6d8",
    storageBucket: "project-hq-2f6d8.firebasestorage.app",
    messagingSenderId: "418542134409",
    appId: "1:418542134409:web:f0068790cc6ef3a8329258"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentDate = null;
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let diaryEntries = {};
  let todos = [];
  let resources = [];
  let todoFilter = 'all';

  // ── 인증 ──
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      await loadAll();
      renderCalendar();
      renderDashboard();
    } else {
      document.getElementById('loginPage').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  window.doLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPw').value;
    const err = document.getElementById('loginError');
    err.style.display = 'none';
    try {
      await signInWithEmailAndPassword(auth, email, pw);
    } catch(e) {
      err.style.display = 'block';
    }
  };

  window.doLogout = async () => {
    await signOut(auth);
  };

  // ── 데이터 로드 ──
  async function loadAll() {
    await loadDiaries();
    await loadTodos();
    await loadResources();
  }

  async function loadDiaries() {
    diaryEntries = {};
    const q = query(collection(db, `users/${currentUser.uid}/diaries`), orderBy('date', 'desc'));
    const snap = await getDocs(q);
    snap.forEach(d => { diaryEntries[d.id] = d.data().content; });
  }

  async function loadTodos() {
    todos = [];
    const q = query(collection(db, `users/${currentUser.uid}/todos`), orderBy('createdAt'));
    const snap = await getDocs(q);
    snap.forEach(d => { todos.push({ id: d.id, ...d.data() }); });
    renderTodos();
  }

  async function loadResources() {
    resources = [];
    const q = query(collection(db, `users/${currentUser.uid}/resources`), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    snap.forEach(d => { resources.push({ id: d.id, ...d.data() }); });
    renderResources();
  }

  // ── 캘린더 ──
  window.changeMonth = (dir) => { calMonth += dir; if(calMonth>11){calMonth=0;calYear++;}else if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); };
  window.goToday = () => { calYear=new Date().getFullYear(); calMonth=new Date().getMonth(); renderCalendar(); };

  function renderCalendar() {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('calTitle').textContent = `${calYear}년 ${months[calMonth]}`;
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    ['일','월','화','수','목','금','토'].forEach(d => {
      const el = document.createElement('div'); el.className='cal-day-name'; el.textContent=d; grid.appendChild(el);
    });
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth+1, 0).getDate();
    const today = new Date();
    for(let i=0;i<first;i++){const el=document.createElement('div');el.className='cal-day empty';grid.appendChild(el);}
    for(let d=1;d<=days;d++){
      const el = document.createElement('div'); el.className='cal-day';
      const key = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      el.textContent = d;
      if(today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d) el.classList.add('today');
      if(diaryEntries[key]) el.classList.add('has-entry');
      if(currentDate===key) el.classList.add('selected');
      el.onclick = () => openDiary(key);
      grid.appendChild(el);
    }
  }

  window.openDiary = (key) => {
    currentDate = key;
    renderCalendar();
    const panel = document.getElementById('diaryPanel');
    panel.style.display = 'block';
    document.getElementById('diaryDateTitle').textContent = `📝 ${key}`;
    document.getElementById('diaryText').value = diaryEntries[key] || '';
    document.getElementById('deleteDiaryBtn').style.display = diaryEntries[key] ? 'inline-block' : 'none';
    panel.scrollIntoView({ behavior: 'smooth' });
  };

  window.closeDiary = () => {
    document.getElementById('diaryPanel').style.display = 'none';
    currentDate = null; renderCalendar();
  };

  window.saveEntry = async () => {
    if(!currentDate) return;
    const content = document.getElementById('diaryText').value.trim();
    if(!content) return showToast('내용을 입력해주세요.');
    await setDoc(doc(db, `users/${currentUser.uid}/diaries`, currentDate), { date: currentDate, content, updatedAt: new Date().toISOString() });
    diaryEntries[currentDate] = content;
    document.getElementById('deleteDiaryBtn').style.display = 'inline-block';
    renderCalendar(); renderDashboard(); showToast('✅ 저장되었습니다!');
  };

  window.deleteEntry = async () => {
    if(!currentDate || !confirm('삭제할까요?')) return;
    await deleteDoc(doc(db, `users/${currentUser.uid}/diaries`, currentDate));
    delete diaryEntries[currentDate];
    closeDiary(); renderDashboard(); showToast('🗑️ 삭제되었습니다.');
  };

  // ── TODO ──
  window.addTodo = async () => {
    const input = document.getElementById('todoInput');
    const text = input.value.trim();
    if(!text) return;
    const id = Date.now().toString();
    const todo = { text, done: false, createdAt: new Date().toISOString() };
    await setDoc(doc(db, `users/${currentUser.uid}/todos`, id), todo);
    todos.push({ id, ...todo });
    input.value = '';
    renderTodos(); renderDashboard(); showToast('✅ 추가되었습니다!');
  };

  window.toggleTodo = async (id) => {
    const todo = todos.find(t=>t.id===id);
    if(!todo) return;
    todo.done = !todo.done;
    await setDoc(doc(db, `users/${currentUser.uid}/todos`, id), todo);
    renderTodos(); renderDashboard();
  };

  window.deleteTodo = async (id) => {
    await deleteDoc(doc(db, `users/${currentUser.uid}/todos`, id));
    todos = todos.filter(t=>t.id!==id);
    renderTodos(); renderDashboard(); showToast('🗑️ 삭제되었습니다.');
  };

  window.filterTodo = (f, btn) => {
    todoFilter = f;
    document.querySelectorAll('.todo-filter button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderTodos();
  };

  function renderTodos() {
    const list = document.getElementById('todoList');
    let filtered = todos;
    if(todoFilter==='active') filtered = todos.filter(t=>!t.done);
    if(todoFilter==='done') filtered = todos.filter(t=>t.done);
    if(!filtered.length){ list.innerHTML='<div class="search-empty">할 일이 없습니다 🎉</div>'; return; }
    list.innerHTML = filtered.map(t => `
      <div class="todo-item ${t.done?'done':''}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')" />
        <span>${t.text}</span>
        <button onclick="deleteTodo('${t.id}')">✕</button>
      </div>`).join('');
  }

  // ── 자료실 ──
  window.addResource = async () => {
    const title = document.getElementById('resTitle').value.trim();
    const url = document.getElementById('resUrl').value.trim();
    const memo = document.getElementById('resMemo').value.trim();
    if(!title || !url) return showToast('제목과 링크를 입력해주세요.');
    const id = Date.now().toString();
    const res = { title, url, memo, createdAt: new Date().toISOString() };
    await setDoc(doc(db, `users/${currentUser.uid}/resources`, id), res);
    resources.unshift({ id, ...res });
    document.getElementById('resTitle').value='';
    document.getElementById('resUrl').value='';
    document.getElementById('resMemo').value='';
    renderResources(); renderDashboard(); showToast('✅ 추가되었습니다!');
  };

  window.deleteResource = async (id) => {
    if(!confirm('삭제할까요?')) return;
    await deleteDoc(doc(db, `users/${currentUser.uid}/resources`, id));
    resources = resources.filter(r=>r.id!==id);
    renderResources(); renderDashboard(); showToast('🗑️ 삭제되었습니다.');
  };

  function renderResources() {
    const list = document.getElementById('resourceList');
    if(!resources.length){ list.innerHTML='<div class="search-empty">자료가 없습니다.</div>'; return; }
    list.innerHTML = resources.map(r => `
      <div class="resource-item">
        <div class="resource-icon">🔗</div>
        <div class="resource-info">
          <a href="${r.url}" target="_blank">${r.title}</a>
          <p>${r.memo || ''}</p>
        </div>
        <button onclick="deleteResource('${r.id}')">✕</button>
      </div>`).join('');
  }

  // ── 검색 ──
  window.doSearch = () => {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const results = document.getElementById('searchResults');
    if(!q){ results.innerHTML='<div class="search-empty">검색어를 입력해주세요.</div>'; return; }
    const diaryResults = Object.entries(diaryEntries)
      .filter(([k,v]) => v.toLowerCase().includes(q) || k.includes(q))
      .sort((a,b) => b[0].localeCompare(a[0]));
    const resourceResults = resources.filter(r => r.title.toLowerCase().includes(q) || (r.memo||'').toLowerCase().includes(q));
    if(!diaryResults.length && !resourceResults.length){
      results.innerHTML='<div class="search-empty">검색 결과가 없습니다.</div>'; return;
    }
    let html = '';
    diaryResults.forEach(([date, content]) => {
      html += `<div class="search-result" onclick="goToDiary('${date}')">
        <div class="date">📅 ${date}</div>
        <div class="preview">${content.substring(0,100)}${content.length>100?'...':''}</div>
      </div>`;
    });
    resourceResults.forEach(r => {
      html += `<div class="search-result">
        <div class="date">🗂️ 자료실</div>
        <div class="preview"><a href="${r.url}" target="_blank">${r.title}</a> ${r.memo?'— '+r.memo:''}</div>
      </div>`;
    });
    results.innerHTML = html;
  };

  window.goToDiary = (date) => {
    const [y,m] = date.split('-');
    calYear = parseInt(y); calMonth = parseInt(m)-1;
    showPage('calendar');
    setTimeout(() => openDiary(date), 100);
  };

  // ── 대시보드 ──
  function renderDashboard() {
    document.getElementById('statDiary').textContent = Object.keys(diaryEntries).length;
    document.getElementById('statTodoDone').textContent = todos.filter(t=>t.done).length;
    document.getElementById('statTodoLeft').textContent = todos.filter(t=>!t.done).length;
    document.getElementById('statResource').textContent = resources.length;
    const recent = Object.entries(diaryEntries).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,5);
    const list = document.getElementById('recentList');
    if(!recent.length){ list.innerHTML='<div class="search-empty">기록이 없습니다.</div>'; return; }
    list.innerHTML = recent.map(([date,content]) => `
      <div class="recent-item" onclick="goToDiary('${date}')">
        <div class="recent-date">${date}</div>
        <div class="recent-text">${content.substring(0,60)}...</div>
      </div>`).join('');
  }

  // ── 페이지 전환 ──
  window.showPage = (name) => {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.sidebar nav a').forEach(a=>a.classList.remove('active'));
    document.getElementById(`page-${name}`).classList.add('active');
    document.getElementById(`nav-${name}`).classList.add('active');
    if(name==='dashboard') renderDashboard();
    if(name==='calendar') renderCalendar();
  };

  // ── 토스트 ──
  window.showToast = (msg) => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  };
</script>
</body>
</html>
